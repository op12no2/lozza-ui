<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lozza examples (local)</title>
</head>
<body>

<p>Engine: <code id="engine"></code> (<span id="switch"></span>)</p>

<p><a id="hello" href="">hello world</a>
<p><a id="stop" href="">stop</a>
<p><a id="promise" href="">promise wrapper</a>
<p><a id="analysis" href="">multi pv analysis</a>
<p><a id="play" href="">play</a>
<p><a id="nps" href="">compare search speed</a>

<script>
const builds = ['lozzaNNUE', 'lozzaHCE', 'lozzaMini', 'lozzaMat', 'lozzaBeal'];
const engine = new URLSearchParams(location.search).get('engine') || 'lozzaHCE';

document.getElementById('engine').textContent = engine + '.js';
document.getElementById('switch').innerHTML = builds.filter(b => b !== engine).map(b => '<a href="local.html?engine=' + b + '">' + b + '</a>').join(' ');

for (const id of ['hello', 'stop', 'promise', 'analysis', 'play', 'nps'])
  document.getElementById(id).href = 'http://localhost:8000/examples/' + id + '.html?engine=' + engine;
</script>

</body>
</html>
