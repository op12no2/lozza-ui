<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bratko-Kopec</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 70em;
    margin: 2em auto;
    padding: 0 1em;
  }
  table {
    border-collapse: collapse;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
  }
  td, th {
    text-align: left;
    padding: 0.3em 1em 0.3em 0;
    vertical-align: top;
    white-space: nowrap;
  }
  .pass { color: green; }
  .fail { color: red; }
  #summary { font-weight: bold; }
</style>
</head>
<body>

<h1>Bratko-Kopec</h1>

<p>The 24 positions of the <a href="https://www.chessprogramming.org/Bratko-Kopec_Test">Bratko-Kopec test</a>,
each searched for a fixed time. A position is solved if the best move matches.</p>

<p>
  <label>Search time <input id="movetime" type="number" value="100" min="10" step="100" style="width:6em"> ms</label>
  <button id="start">Start</button>
</p>

<table id="results"></table>

<p id="summary"></p>

<script>
const tests = [
  {id: 'BK.01', fen: '1k1r4/pp1b1R2/3q2pp/4p3/2B5/4Q3/PPP2B2/2K5 b - - 0 1', san: 'Qd1+', uci: ['d6d1']},
  {id: 'BK.02', fen: '3r1k2/4npp1/1ppr3p/p6P/P2PPPP1/1NR5/5K2/2R5 w - - 0 1', san: 'd5', uci: ['d4d5']},
  {id: 'BK.03', fen: '2q1rr1k/3bbnnp/p2p1pp1/2pPp3/PpP1P1P1/1P2BNNP/2BQ1PRK/7R b - - 0 1', san: 'f5', uci: ['f6f5']},
  {id: 'BK.04', fen: 'rnbqkb1r/p3pppp/1p6/2ppP3/3N4/2P5/PPP1QPPP/R1B1KB1R w KQkq - 0 1', san: 'e6', uci: ['e5e6']},
  {id: 'BK.05', fen: 'r1b2rk1/2q1b1pp/p2ppn2/1p6/3QP3/1BN1B3/PPP3PP/R4RK1 w - - 0 1', san: 'Nd5 a4', uci: ['c3d5', 'a2a4']},
  {id: 'BK.06', fen: '2r3k1/pppR1pp1/4p3/4P1P1/5P2/1P4K1/P1P5/8 w - - 0 1', san: 'g6', uci: ['g5g6']},
  {id: 'BK.07', fen: '1nk1r1r1/pp2n1pp/4p3/q2pPp1N/b1pP1P2/B1P2R2/2P1B1PP/R2Q2K1 w - - 0 1', san: 'Nf6', uci: ['h5f6']},
  {id: 'BK.08', fen: '4b3/p3kp2/6p1/3pP2p/2pP1P2/4K1P1/P3N2P/8 w - - 0 1', san: 'f5', uci: ['f4f5']},
  {id: 'BK.09', fen: '2kr1bnr/pbpq4/2n1pp2/3p3p/3P1P1B/2N2N1Q/PPP3PP/2KR1B1R w - - 0 1', san: 'f5', uci: ['f4f5']},
  {id: 'BK.10', fen: '3rr1k1/pp3pp1/1qn2np1/8/3p4/PP1R1P2/2P1NQPP/R1B3K1 b - - 0 1', san: 'Ne5', uci: ['c6e5']},
  {id: 'BK.11', fen: '2r1nrk1/p2q1ppp/bp1p4/n1pPp3/P1P1P3/2PBB1N1/4QPPP/R4RK1 w - - 0 1', san: 'f4', uci: ['f2f4']},
  {id: 'BK.12', fen: 'r3r1k1/ppqb1ppp/8/4p1NQ/8/2P5/PP3PPP/R3R1K1 b - - 0 1', san: 'Bf5', uci: ['d7f5']},
  {id: 'BK.13', fen: 'r2q1rk1/4bppp/p2p4/2pP4/3pP3/3Q4/PP1B1PPP/R3R1K1 w - - 0 1', san: 'b4', uci: ['b2b4']},
  {id: 'BK.14', fen: 'rnb2r1k/pp2p2p/2pp2p1/q2P1p2/8/1Pb2NP1/PB2PPBP/R2Q1RK1 w - - 0 1', san: 'Qd2 Qe1', uci: ['d1d2', 'd1e1']},
  {id: 'BK.15', fen: '2r3k1/1p2q1pp/2b1pr2/p1pp4/6Q1/1P1PP1R1/P1PN2PP/5RK1 w - - 0 1', san: 'Qxg7+', uci: ['g4g7']},
  {id: 'BK.16', fen: 'r1bqkb1r/4npp1/p1p4p/1p1pP1B1/8/1B6/PPPN1PPP/R2Q1RK1 w kq - 0 1', san: 'Ne4', uci: ['d2e4']},
  {id: 'BK.17', fen: 'r2q1rk1/1ppnbppp/p2p1nb1/3Pp3/2P1P1P1/2N2N1P/PPB1QP2/R1B2RK1 b - - 0 1', san: 'h5', uci: ['h7h5']},
  {id: 'BK.18', fen: 'r1bq1rk1/pp2ppbp/2np2p1/2n5/P3PP2/N1P2N2/1PB3PP/R1B1QRK1 b - - 0 1', san: 'Nb3', uci: ['c5b3']},
  {id: 'BK.19', fen: '3rr3/2pq2pk/p2p1pnp/8/2QBPP2/1P6/P5PP/4RRK1 b - - 0 1', san: 'Rxe4', uci: ['e8e4']},
  {id: 'BK.20', fen: 'r4k2/pb2bp1r/1p1qp2p/3pNp2/3P1P2/2N3P1/PPP1Q2P/2KRR3 w - - 0 1', san: 'g4', uci: ['g3g4']},
  {id: 'BK.21', fen: '3rn2k/ppb2rpp/2ppqp2/5N2/2P1P3/1P5Q/PB3PPP/3RR1K1 w - - 0 1', san: 'Nh6', uci: ['f5h6']},
  {id: 'BK.22', fen: '2r2rk1/1bqnbpp1/1p1ppn1p/pP6/N1P1P3/P2B1N1P/1B2QPP1/R2R2K1 b - - 0 1', san: 'Bxe4', uci: ['b7e4']},
  {id: 'BK.23', fen: 'r1bqk2r/pp2bppp/2p5/3pP3/P2Q1P2/2N1B3/1PP3PP/R4RK1 b kq - 0 1', san: 'f6', uci: ['f7f6']},
  {id: 'BK.24', fen: 'r2qnrnk/p2b2b1/1p1p2pp/2pPpp2/1PP1P3/PRNBB3/3QNPPP/5RK1 w - - 0 1', san: 'f4', uci: ['f2f4']},
];

let lozza = null;
const results = document.getElementById('results');
const summary = document.getElementById('summary');

let index = 0;
let solved = 0;
let t0 = 0;

function run() {
  const t = tests[index];
  t0 = performance.now();
  lozza.postMessage('ucinewgame');
  lozza.postMessage('position fen ' + t.fen);
  lozza.postMessage('go movetime ' + document.getElementById('movetime').value);
}

function onMessage(e) {
  const line = e.data;
  if (!line.startsWith('bestmove '))
    return;
  const t = tests[index];
  const move = line.split(' ')[1];
  const ok = t.uci.indexOf(move) >= 0;
  if (ok)
    solved++;
  const row = results.insertRow();
  row.innerHTML = '<td>' + t.id + '</td><td>' + t.fen + '</td><td>' + t.san + '</td><td>' + move
    + '</td><td>' + Math.round(performance.now() - t0) + ' ms</td><td class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'solved' : 'FAIL') + '</td>';
  index++;
  if (index < tests.length)
    run();
  else
    summary.textContent = solved + ' of ' + tests.length + ' solved';
}

function start() {
  if (lozza)
    lozza.terminate();
  lozza = new Worker('lozza.js');
  lozza.onmessage = onMessage;
  results.innerHTML = '<tr><th>id</th><th>fen</th><th>bm</th><th>got</th><th>time</th><th>result</th></tr>';
  summary.textContent = '';
  index = 0;
  solved = 0;
  run();
}

document.getElementById('start').onclick = start;

start();
</script>

</body>
</html>
